name: CI-pullrequest

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Checkout into branch
        run: git checkout -b staging-pr-workflow

      - name: Install build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y make curl tar xz-utils jq
          sudo curl -sL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Pull scripts
        run: sudo make pull-scripts

      - name: Pull in all relevant branches
        run: git fetch origin main

      - name: Prepare traefik patches for Renovate PRs
        if: github.actor == 'renovate[bot]'
        run: |
          set -euo pipefail
          export PACKAGE=traefik
          patch_backup="$(mktemp -d)"
          if [ -d packages/traefik/generated-changes/patch ]; then
            mv packages/traefik/generated-changes/patch "$patch_backup/patch"
            mkdir -p packages/traefik/generated-changes/patch
          fi
          make prepare
          traefik_version="$(yq -r '.appVersion' packages/traefik/charts/Chart.yaml)"
          ./packages/traefik/k3s-patches.sh packages/traefik/charts "$traefik_version"
          if [ ! -f packages/traefik/charts/templates/validate-install-crd.yaml ]; then
            mkdir -p packages/traefik/charts/templates
            cat > packages/traefik/charts/templates/validate-install-crd.yaml <<'EOF'
          {{- /* placeholder for charts-build-scripts CRD extraction; removed during patch */ -}}
          EOF
          fi
          make patch
          make clean
          make charts
          if [ -d "$patch_backup/patch" ]; then
            rm -rf packages/traefik/generated-changes/patch
            mv "$patch_backup/patch" packages/traefik/generated-changes/patch
          fi
      
      - name: Validate 
        run: sudo make validate
